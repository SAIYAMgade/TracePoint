<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="erdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1100" height="420" rx="14" fill="#080c14" stroke="#1e293b" stroke-width="1.5"/>
  <text x="30" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
    TracePoint Oracle Relational Schema Architecture (10 Normalized Entities)
  </text>
  <text x="30" y="50" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">
    Normalized DDL with Primary/Foreign Keys, Unique/Check Constraints, Temporal Data Types, and Indexes
  </text>

  <!-- Table 1: DEFECTS -->
  <g transform="translate(30, 75)">
    <rect width="210" height="150" rx="6" fill="url(#erdGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="210" height="26" rx="6" fill="#0369a1" />
    <text x="105" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">DEFECTS</text>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">PK defect_id VARCHAR2(32)</text>
    <text x="12" y="60" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">title VARCHAR2(255)</text>
    <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">severity VARCHAR2(20)</text>
    <text x="12" y="92" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">status VARCHAR2(30)</text>
    <text x="12" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">reproduction_status</text>
    <text x="12" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">verification_status</text>
    <text x="12" y="140" font-family="ui-monospace, monospace" font-size="10" fill="#f59e0b">FK associated_release_id</text>
  </g>

  <!-- Connector: DEFECTS -> INVESTIGATIONS -->
  <path d="M 240 120 L 290 120" stroke="#64748b" stroke-width="1.5" />
  <text x="265" y="114" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">1:1</text>

  <!-- Table 2: INVESTIGATIONS -->
  <g transform="translate(290, 75)">
    <rect width="220" height="150" rx="6" fill="url(#erdGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <rect width="220" height="26" rx="6" fill="#7e22ce" />
    <text x="110" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">INVESTIGATIONS</text>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc">PK investigation_id</text>
    <text x="12" y="60" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">FK defect_id (UNIQUE)</text>
    <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">problem_statement CLOB</text>
    <text x="12" y="92" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">initial_hypothesis CLOB</text>
    <text x="12" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">confirmed_root_cause</text>
    <text x="12" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">verification_plan CLOB</text>
    <text x="12" y="140" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">status VARCHAR2(30)</text>
  </g>

  <!-- Connector: INVESTIGATIONS -> EVENTS -->
  <path d="M 510 120 L 560 120" stroke="#64748b" stroke-width="1.5" />
  <text x="535" y="114" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">1:N</text>

  <!-- Table 3: INVESTIGATION_EVENTS -->
  <g transform="translate(560, 75)">
    <rect width="220" height="120" rx="6" fill="url(#erdGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="220" height="26" rx="6" fill="#4338ca" />
    <text x="110" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">INVESTIGATION_EVENTS</text>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#818cf8">PK event_id VARCHAR2(32)</text>
    <text x="12" y="60" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc">FK investigation_id</text>
    <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">event_type VARCHAR2(50)</text>
    <text x="12" y="92" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">title VARCHAR2(255)</text>
    <text x="12" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">actor VARCHAR2(100)</text>
  </g>

  <!-- Table 4: EVIDENCE -->
  <g transform="translate(830, 75)">
    <rect width="230" height="135" rx="6" fill="url(#erdGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <rect width="230" height="26" rx="6" fill="#be123c" />
    <text x="115" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">EVIDENCE</text>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#fb7185">PK evidence_id VARCHAR2(32)</text>
    <text x="12" y="60" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">FK defect_id VARCHAR2(32)</text>
    <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">evidence_type VARCHAR2(50)</text>
    <text x="12" y="92" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">error_code VARCHAR2(50)</text>
    <text x="12" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">sanitized_payload CLOB</text>
    <text x="12" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">collected_by VARCHAR2(100)</text>
  </g>

  <!-- Bottom Row: RELEASES, RELEASE_CHECKS, REGRESSION_TESTS, TEST_RUNS -->
  <!-- Table 5: RELEASES -->
  <g transform="translate(30, 250)">
    <rect width="210" height="140" rx="6" fill="url(#erdGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="26" rx="6" fill="#047857" />
    <text x="105" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">RELEASES</text>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">PK release_id VARCHAR2(32)</text>
    <text x="12" y="60" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">version_tag VARCHAR2(50)</text>
    <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">status VARCHAR2(30)</text>
    <text x="12" y="92" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">is_ready NUMBER(1)</text>
    <text x="12" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">readiness_score NUMBER</text>
    <text x="12" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">rollback_plan CLOB</text>
  </g>

  <!-- Connector: RELEASES -> CHECKS -->
  <path d="M 240 310 L 290 310" stroke="#64748b" stroke-width="1.5" />
  <text x="265" y="304" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">1:N</text>

  <!-- Table 6: RELEASE_CHECKS -->
  <g transform="translate(290, 250)">
    <rect width="220" height="140" rx="6" fill="url(#erdGrad)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="220" height="26" rx="6" fill="#0e7490" />
    <text x="110" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">RELEASE_CHECKS</text>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#22d3ee">PK check_id VARCHAR2(32)</text>
    <text x="12" y="60" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">FK release_id VARCHAR2(32)</text>
    <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">check_name VARCHAR2(100)</text>
    <text x="12" y="92" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">is_mandatory NUMBER(1)</text>
    <text x="12" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">status VARCHAR2(30)</text>
    <text x="12" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">waiver_reason CLOB</text>
  </g>

  <!-- Table 7: REGRESSION_TESTS -->
  <g transform="translate(560, 250)">
    <rect width="220" height="140" rx="6" fill="url(#erdGrad)" stroke="#eab308" stroke-width="1.5"/>
    <rect width="220" height="26" rx="6" fill="#a16207" />
    <text x="110" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">REGRESSION_TESTS</text>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#fde047">PK test_id VARCHAR2(32)</text>
    <text x="12" y="60" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">title VARCHAR2(255)</text>
    <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">FK related_defect_id</text>
    <text x="12" y="92" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">execution_command</text>
    <text x="12" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">last_outcome VARCHAR2(30)</text>
    <text x="12" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">last_run_at TIMESTAMP</text>
  </g>

  <!-- Table 8: DATABASE_CHANGES -->
  <g transform="translate(830, 250)">
    <rect width="230" height="140" rx="6" fill="url(#erdGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="230" height="26" rx="6" fill="#6b21a8" />
    <text x="115" y="17" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">DATABASE_CHANGES</text>
    <text x="12" y="44" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc">PK change_id VARCHAR2(32)</text>
    <text x="12" y="60" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">change_name VARCHAR2(100)</text>
    <text x="12" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">change_type VARCHAR2(50)</text>
    <text x="12" y="92" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">pre_check_query CLOB</text>
    <text x="12" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">post_check_query CLOB</text>
    <text x="12" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">status VARCHAR2(30)</text>
  </g>
</svg>
