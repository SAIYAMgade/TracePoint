<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1000" height="380" rx="14" fill="#080c14" stroke="#1e293b" stroke-width="1.5"/>
  <text x="30" y="36" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
    Objective Release Readiness Gate Engine (REL-2026.1.0)
  </text>
  <text x="30" y="56" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">
    Automated Gate Calculation: Readiness Score = (Passed + Waived) / Total Checks * 100
  </text>

  <!-- Left: Objective Release Checklist -->
  <g transform="translate(30, 80)">
    <!-- Check 1: Mandatory Core Regression -->
    <g transform="translate(0, 0)">
      <rect width="560" height="48" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="24" y="28" font-family="sans-serif" font-size="12" fill="#f87171" font-weight="900" text-anchor="middle">✕</text>
      <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">1. Mandatory Core Regression Suite</text>
      <text x="46" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#f87171">FAILED: test_scenario_e_regression_guard tripped</text>
      <rect x="470" y="14" width="75" height="20" rx="4" fill="#450a0a" stroke="#b91c1c" stroke-width="0.8"/>
      <text x="507" y="28" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#fca5a5" text-anchor="middle">BLOCKER</text>
    </g>

    <!-- Check 2: Zero Blocker Defects -->
    <g transform="translate(0, 56)">
      <rect width="560" height="48" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="24" y="28" font-family="sans-serif" font-size="12" fill="#f87171" font-weight="900" text-anchor="middle">✕</text>
      <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">2. Zero Open Critical / High Blocker Defects</text>
      <text x="46" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#f87171">FAILED: 4 open Critical/High defects unresolved (DEF-101..105)</text>
      <rect x="470" y="14" width="75" height="20" rx="4" fill="#450a0a" stroke="#b91c1c" stroke-width="0.8"/>
      <text x="507" y="28" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#fca5a5" text-anchor="middle">BLOCKER</text>
    </g>

    <!-- Check 3: Oracle Schema Migration -->
    <g transform="translate(0, 112)">
      <rect width="560" height="48" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="24" y="28" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="900" text-anchor="middle">✓</text>
      <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">3. Oracle Schema Migration Validated</text>
      <text x="46" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">PASSED: Pre-check &amp; Post-check VALID (IDX_DEFECTS_COMP)</text>
      <rect x="470" y="14" width="75" height="20" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="507" y="28" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#a7f3d0" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Check 4: Rollback Strategy -->
    <g transform="translate(0, 168)">
      <rect width="560" height="48" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="24" y="28" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="900" text-anchor="middle">✓</text>
      <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">4. Reversible DDL Rollback Plan Documented</text>
      <text x="46" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">PASSED: Reverse DDL verified for implicit commit safety</text>
      <rect x="470" y="14" width="75" height="20" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="507" y="28" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#a7f3d0" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Check 5: Security Smoke -->
    <g transform="translate(0, 224)">
      <rect width="560" height="48" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="24" y="28" font-family="sans-serif" font-size="11" fill="#fcd34d" font-weight="900" text-anchor="middle">⏳</text>
      <text x="46" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">5. API Security &amp; Sanitization Smoke Suite</text>
      <text x="46" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#fcd34d">PENDING: Awaiting staging deployment execution</text>
      <rect x="470" y="14" width="75" height="20" rx="4" fill="#451a03" stroke="#b45309" stroke-width="0.8"/>
      <text x="507" y="28" font-family="ui-monospace, monospace" font-size="9" font-weight="800" fill="#fde68a" text-anchor="middle">PENDING</text>
    </g>
  </g>

  <!-- Right: Readiness Gauge & Decision Box -->
  <g transform="translate(620, 80)">
    <rect width="350" height="272" rx="12" fill="url(#gateGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="35" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8">
      GATE DECISION OUTCOME
    </text>

    <!-- Score Circle Gauge -->
    <g transform="translate(175, 110)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#1e293b" stroke-width="12"/>
      <circle cx="0" cy="0" r="55" fill="none" stroke="#ef4444" stroke-width="12"
              stroke-dasharray="345" stroke-dashoffset="190" stroke-linecap="round"
              transform="rotate(-90)" />
      <text x="0" y="8" font-family="ui-monospace, monospace" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle">45%</text>
      <text x="0" y="26" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">SCORE</text>
    </g>

    <!-- Status Banner -->
    <rect x="25" y="185" width="300" height="34" rx="6" fill="#4c0519" stroke="#e11d48" stroke-width="1.2"/>
    <text x="175" y="206" font-family="ui-monospace, monospace" font-size="13" font-weight="900" fill="#ffe4e6" text-anchor="middle">
      STATUS: BLOCKED (NO-GO)
    </text>

    <text x="25" y="240" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">
      Release cannot be approved while mandatory checks fail or remain unverified.
    </text>
  </g>
</svg>
